<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakZone Word Builder</title><style>body{margin:0;background:#eef4ff;font-family:system-ui,Arial;color:#17315b}.wrap{max-width:680px;margin:30px auto;padding:18px}.card{background:white;border-radius:24px;padding:26px;box-shadow:0 12px 32px #183c771a;text-align:center}h1{margin:8px 0;color:#123d85}.sub{color:#657b9c}.top{display:flex;justify-content:space-between;font-weight:700;color:#315787}.emoji{font-size:90px;margin:16px}.slots{display:flex;justify-content:center;gap:12px;margin:22px 0}.slot{width:65px;height:68px;border:3px dashed #9cb5da;border-radius:14px;display:grid;place-items:center;font-size:34px;font-weight:800;background:#f5f9ff}.letters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{cursor:pointer;border:0;border-radius:13px;font-weight:800}.letter{background:#143e84;color:white;font-size:28px;width:70px;height:68px}.letter:disabled{opacity:.25}.actions{margin-top:20px;display:flex;gap:10px;justify-content:center}.action{padding:13px 22px;background:#e5edfb;color:#214477}.primary{background:#173e85;color:white}.feedback{min-height:28px;margin:16px;font-weight:800;font-size:19px}.ok{color:#17834c}.bad{color:#bd3d48}.progress{height:9px;background:#e7eefb;border-radius:20px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#2b72d4;transition:width .3s}.hide{display:none}</style></head><body><main class="wrap"><section class="card"><div class="top"><span>SpeakZone English</span><span id="score">Score: 0</span></div><h1>Word Builder</h1><div class="sub">Lesson 3 · CVC Words</div><div class="progress"><div class="bar" id="bar"></div></div><div class="top"><span id="count">Question 1 / 10</span><span>Build the word!</span></div><div id="play"><div class="emoji" id="emoji">🐱</div><div class="sub" id="hint">Look at the picture and tap the letters in order.</div><div class="slots" id="slots"></div><div class="letters" id="letters"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="action" id="clear">↺ Clear</button><button class="action primary" id="next" disabled>Next →</button></div></div><div id="finish" class="hide"><div class="emoji">🏆</div><h2>Great work!</h2><p id="result"></p><button class="action primary" id="again">Play again</button></div></section></main><script>const words=[['CAT','🐱'],['SUN','☀️'],['PEN','🖊️'],['BED','🛏️'],['PIG','🐷'],['CUP','🥤'],['HAT','🎩'],['BAG','🎒'],['MAP','🗺️'],['BAT','🦇']];let qs=[],idx=0,score=0,picked=[],order=[],locked=false;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){qs=shuffle(words);idx=0;score=0;$('finish').classList.add('hide');$('play').classList.remove('hide');render()}function render(){locked=false;picked=[];const [word,emoji]=qs[idx];order=shuffle([...word].map((ch,i)=>({ch,i})));$('emoji').textContent=emoji;$('score').textContent='Score: '+score;$('count').textContent=`Question ${idx+1} / ${qs.length}`;$('bar').style.width=(idx/qs.length*100)+'%';$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;$('next').textContent=idx===qs.length-1?'Finish →':'Next →';draw()}function draw(){const word=qs[idx][0];$('slots').innerHTML=[...word].map((_,i)=>`<div class="slot">${picked[i]===undefined?'':order[picked[i]].ch}</div>`).join('');$('letters').innerHTML='';order.forEach((obj,i)=>{const b=document.createElement('button');b.className='letter';b.textContent=obj.ch;b.disabled=locked||picked.includes(i);b.onclick=()=>{picked.push(i);draw();if(picked.length===word.length)check()};$('letters').append(b)})}function check(){locked=true;const answer=picked.map(i=>order[i].ch).join('');const good=answer===qs[idx][0];if(good)score++;$('score').textContent='Score: '+score;$('feedback').textContent=good?'✓ Correct! Great job!':'✗ Try again next time! Correct word: '+qs[idx][0];$('feedback').className='feedback '+(good?'ok':'bad');$('next').disabled=false;draw()}$('clear').onclick=()=>{if(!locked){picked=[];draw()}};$('next').onclick=()=>{idx++;if(idx>=qs.length){$('play').classList.add('hide');$('finish').classList.remove('hide');$('bar').style.width='100%';$('result').textContent=`You scored ${score} out of ${qs.length}!`}else render()};$('again').onclick=start;start();</script></body></html>
